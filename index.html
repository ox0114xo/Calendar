<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A4 滿版月曆生成器 - 純白底色版</title>
    <style>
        /* 定義可動態調整邊距的 CSS 變數，預設改為 1mm */
        :root {
            --page-padding: 1mm;
            --page-width: 210mm;
            --page-height: 297mm;
            --page-aspect: 210 / 297;
            --print-width: 210mm;
            --print-height: 296mm;
            --print-max-height: 297mm;
            --print-orientation: portrait;
            --title-font-size: 28px;
            --date-font-size: 16px;
        }

        /* 橫式覆寫 */
        :root.landscape-mode {
            --page-width: 297mm;
            --page-height: 210mm;
            --page-aspect: 297 / 210;
            --print-width: 297mm;
            --print-height: 209mm;
            --print-max-height: 210mm;
            --print-orientation: landscape;
        }

        /* 基本重置與字體 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
        }

        body {
            background-color: #555;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* =========================================
           控制面板 UI 設計
           ========================================= */
        .controls {
            background-color: #fff;
            padding: 20px 25px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .options-row {
            justify-content: flex-start;
            gap: 30px;
        }

        .divider {
            border: 0;
            border-top: 1px solid #eaeaea;
            width: 100%;
            margin: 0;
        }

        /* 統一表單元素風格 */
        .controls select, .controls input[type="number"], .controls button {
            padding: 8px 12px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s;
        }

        .controls select:focus, .controls input[type="number"]:focus {
            border-color: #4CAF50;
        }

        .controls input[type="number"] {
            width: 70px;
            text-align: center;
        }

        .controls button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.1s;
        }

        .controls button:hover { background-color: #45a049; }
        .controls button:active { transform: scale(0.98); }

        .btn-secondary { background-color: #008CBA !important; }
        .btn-secondary:hover { background-color: #007bb5 !important; }
        .btn-small { padding: 6px 10px !important; font-size: 14px !important; }

        /* 勾選框文字標籤 */
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            user-select: none;
            color: #333;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #4CAF50;
        }

        /* 橫式/直式切換按鈕 */
        .orientation-toggle {
            display: flex;
            border: 1px solid #ccc;
            border-radius: 6px;
            overflow: hidden;
        }

        .orient-btn {
            padding: 7px 14px !important;
            font-size: 14px !important;
            background-color: #f5f5f5 !important;
            color: #555 !important;
            border: none !important;
            border-radius: 0 !important;
            cursor: pointer;
            font-weight: normal !important;
            transition: background-color 0.2s, color 0.2s !important;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .orient-btn:not(:last-child) {
            border-right: 1px solid #ccc !important;
        }

        .orient-btn.active {
            background-color: #4CAF50 !important;
            color: white !important;
            font-weight: bold !important;
        }

        .orient-btn:hover:not(.active) {
            background-color: #e8e8e8 !important;
        }

        /* 月份勾選區塊 */
        .month-selectors {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            width: 100%;
        }

        .month-selectors label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            font-size: 15px;
            padding: 10px 5px;
            background: #f9f9f9;
            border-radius: 8px;
            border: 1px solid #ddd;
            transition: background 0.2s;
            user-select: none;
            color: #444;
        }

        .month-selectors label:hover { background: #eee; }
        .month-selectors input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #008CBA;
        }

        /* --- 手機版專屬格局優化 --- */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .controls { padding: 15px; gap: 12px; }
            .header-row { flex-direction: column; align-items: stretch; gap: 12px; }
            .print-btn-wrapper button { width: 100%; padding: 12px !important; font-size: 16px !important; }
            .options-row { flex-direction: column; align-items: flex-start; gap: 12px; }
            .margin-row { justify-content: space-between; width: 100%; }
            .month-selectors { grid-template-columns: repeat(4, 1fr); gap: 8px; }
            .month-selectors label { font-size: 14px; padding: 8px 2px; }
        }

        @media (max-width: 400px) {
            .month-selectors { grid-template-columns: repeat(3, 1fr); }
        }

        /* =========================================
           月曆頁面設計 (A4 顯示與列印)
           ========================================= */
        #calendarContainer {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            align-items: center;
        }

        /* ★ 預覽用真實 A4 尺寸（跟列印同一組寬高），再依螢幕寬度整頁縮放（--preview-zoom 由 JS 計算），
           調字體大小、邊界時預覽會等比例跟著變，手機上看到的就是印出來的樣子 */
        .page {
            width: var(--print-width);
            height: var(--print-height);
            flex-shrink: 0;
            zoom: var(--preview-zoom, 1);
            background-color: #eeeeee;
            padding: var(--page-padding);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        /* 橫式時字型稍微調大（預設值由 JS setOrientation 寫入變數） */
        :root.landscape-mode .weekday {
            font-size: 16px;
        }
        :root.landscape-mode .holiday-text {
            font-size: 12px;
        }
        :root.landscape-mode .todo-input {
            font-size: 14px;
        }

        .calendar-header {
            text-align: center;
            font-size: var(--title-font-size);
            font-weight: normal;
            margin-bottom: 8px;
            color: #333;
        }

        .calendar-grid {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            border-top: 1px solid #888;
            border-left: 1px solid #888;
        }

        .weekdays { display: flex; }

        .weekday {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            font-size: 15px;
            font-weight: normal;
            color: #333;
            border-right: 1px solid #888;
            border-bottom: 1px solid #888;
        }
        
        .weekday.weekend { color: #d9534f; }

        .days {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .week-row { display: flex; flex: 1; }

        .day-cell {
            flex: 1;
            border-right: 1px solid #888;
            border-bottom: 1px solid #888;
            padding: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #ffffff; /* 一般日期純白色 */
            transition: background-color 0.3s;
        }

        /* 假日底色 */
        #calendarContainer.show-holidays-mode .day-cell.is-holiday {
            background-color: #fff0f0;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 4px;
        }

        .day-number {
            font-size: var(--date-font-size);
            color: #333;
        }

        .holiday-text {
            font-size: 11px;
            color: #d9534f;
            opacity: 0.5;
            text-align: right;
            line-height: 1.2;
            word-break: break-all;
        }

        .is-holiday .day-number { color: #d9534f; }

        .todo-input {
            flex-grow: 1;
            outline: none;
            font-size: 13px;
            color: #444;
            line-height: 1.4;
            overflow: hidden;
            word-break: break-all;
            cursor: text;
        }

        .todo-input:focus { background-color: rgba(255, 255, 255, 0.5); }

        .other-month .day-number { color: #aaa; }
        .other-month .holiday-text { color: #e59b99; }
        .other-month { background-color: #f7f7f7 !important; }

        /* 當月日期：用 inset shadow 模擬加粗邊框，不影響格線對齊 */
        .day-cell:not(.other-month) {
            box-shadow: inset 1px 1px 0 0 #555;
        }
        /* 列印也要套用 */


        /* ★ 農曆／節氣小字（日期數字下方） */
        .day-left { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
        .lunar-text { font-size: 11px; color: #999; line-height: 1.2; margin-top: 2px; white-space: nowrap; }
        .lunar-text.term { color: #2e7d32; font-weight: bold; }
        .lunar-text.festival { color: #c0392b; }
        .lunar-text.month { color: #b8860b; font-weight: bold; }
        :root.landscape-mode .lunar-text { font-size: 12px; }
        .other-month .lunar-text { opacity: 0.55; }

        /* ★ 省墨（純白）：整頁白底、假日不塗底色，只留紅字與格線 */
        #calendarContainer.eco-mode .page { background-color: #ffffff !important; }
        #calendarContainer.eco-mode.show-holidays-mode .day-cell.is-holiday { background-color: #ffffff !important; }
        #calendarContainer.eco-mode .other-month { background-color: #ffffff !important; }

        /* ★ 假日資料提示、PDF 產生中遮罩 */
        .holiday-notice { display: none; margin-top: 12px; padding: 8px 12px; border-radius: 8px; background: #fff3cd; color: #7a5b00; font-size: 14px; line-height: 1.5; }
        .holiday-notice.show { display: block; }
        #pdfOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); color: #fff; display: none; align-items: center; justify-content: center; z-index: 9999; font-size: 18px; font-weight: bold; text-align: center; padding: 20px; }
        #pdfOverlay.show { display: flex; }

        /* --- 列印專用 CSS (防跑版修復) --- */
        @media print {
            body { background-color: transparent; padding: 0; margin: 0; }
            .controls { display: none; }
            #calendarContainer { gap: 0; }
            .page {
                box-shadow: none;
                width: var(--print-width) !important;
                height: var(--print-height) !important;
                max-height: var(--print-max-height) !important;
                aspect-ratio: auto;
                padding: var(--page-padding) !important;
                margin: 0 auto;
                zoom: 1 !important;
                page-break-after: always;
                page-break-inside: avoid;
                break-inside: avoid;
                overflow: hidden;
                background-color: #eeeeee !important; 
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .page:last-child { page-break-after: auto; }
            
            /* 避免網格內部標題斷層 */
            .calendar-header { 
                margin-bottom: 8px !important; 
                page-break-after: avoid;
            }
            .calendar-grid {
                page-break-before: avoid;
            }
            
            #calendarContainer.show-holidays-mode .day-cell.is-holiday { background-color: #fff0f0 !important; }
            .weekday { font-size: 15px !important; padding: 8px 0 !important; }
            .day-number { font-size: var(--date-font-size) !important; }
            .holiday-text { font-size: 11px !important; opacity: 0.5 !important; }
            .todo-input { font-size: 13px !important; }
            .day-cell { padding: 6px !important; background-color: #ffffff !important; }
            .day-cell:not(.other-month) { box-shadow: inset 1px 1px 0 0 #555 !important; }
            .other-month { background-color: #f7f7f7 !important; }
            .calendar-header { font-size: var(--title-font-size) !important; margin-bottom: 8px !important; page-break-after: avoid; }
            :root.landscape-mode .weekday { font-size: 16px !important; }
            :root.landscape-mode .holiday-text { font-size: 12px !important; }
            :root.landscape-mode .todo-input { font-size: 14px !important; }
            .todo-input:empty::before { content: ""; }
            .lunar-text { font-size: 11px !important; }
            :root.landscape-mode .lunar-text { font-size: 12px !important; }
            #calendarContainer.eco-mode .page { background-color: #ffffff !important; }
            #calendarContainer.eco-mode.show-holidays-mode .day-cell.is-holiday { background-color: #ffffff !important; }
            #calendarContainer.eco-mode .other-month { background-color: #ffffff !important; }
            .holiday-notice, #pdfOverlay { display: none !important; }
        }
    </style>
</head>
<body>
    <div id="pdfOverlay"><div>📄 正在產生 PDF…<br><span id="pdfProgress" style="font-size:15px;font-weight:normal;"></span></div></div>

    <div class="controls no-print">
        <div class="control-section header-row">
            <div style="display: flex; gap: 10px; align-items: center;">
                <select id="yearSelect"></select>
                <span style="font-size:16px; font-weight: bold; color: #333;">年</span>
            </div>
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <!-- 橫式/直式切換 -->
                <div class="orientation-toggle" id="orientationToggle" title="切換橫式/直式">
                    <button class="orient-btn" id="btnPortrait" onclick="setOrientation('portrait')">
                        <svg width="14" height="18" viewBox="0 0 14 18" fill="none" style="display:inline-block;vertical-align:middle;margin-right:4px"><rect x="1" y="1" width="12" height="16" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg>直式
                    </button>
                    <button class="orient-btn active" id="btnLandscape" onclick="setOrientation('landscape')">
                        <svg width="18" height="14" viewBox="0 0 18 14" fill="none" style="display:inline-block;vertical-align:middle;margin-right:4px"><rect x="1" y="1" width="16" height="12" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg>橫式
                    </button>
                </div>
                <div class="print-btn-wrapper" style="display:flex; gap:8px; flex-wrap:wrap;">
                    <button onclick="triggerPrint()">🖨️ 列印勾選月份</button>
                    <button id="pdfBtn" onclick="downloadPDF()" style="background-color:#0d6efd;">📄 下載 PDF</button>
                </div>
            </div>
        </div>

        <hr class="divider">

        <div class="control-section options-row">
            <label class="checkbox-label">
                <input type="checkbox" id="showHolidays" checked>
                顯示台灣假日
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="sundayFirst">
                星期日為第一天
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="showLunar" checked>
                顯示農曆／節氣
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="ecoMode">
                省墨（純白）
            </label>
        </div>
        <div id="holidayNotice" class="holiday-notice"></div>

        <hr class="divider">

        <div class="control-section margin-row">
            <span style="font-weight: bold; color: #333;">邊界設定 (mm)</span>
            <label class="checkbox-label" style="font-weight: normal;">
                四邊距 <input type="number" id="marginAll" value="1" min="0" max="50">
            </label>
        </div>

        <hr class="divider">

        <div class="control-section" style="gap: 20px; flex-wrap: wrap;">
            <span style="font-weight: bold; color: #333;">字體大小 (px)</span>
            <div style="display:flex; flex-direction:column; gap:10px; flex:1; min-width:200px;">
                <div style="display:flex; align-items:center; gap:10px;">
                    <span style="width:56px; color:#333;">標題</span>
                    <input type="range" id="titleFontSlider" min="10" max="60" value="28" style="flex:1;" oninput="syncFont('title','slider')">
                    <input type="number" id="titleFontInput" min="10" max="60" value="28" style="width:54px;text-align:center;padding:4px 6px;font-size:14px;border:1px solid #ccc;border-radius:6px;" oninput="syncFont('title','input')">
                    <span style="color:#888;font-size:13px;">px</span>
                </div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <span style="width:56px; color:#333;">日期數字</span>
                    <input type="range" id="dateFontSlider" min="8" max="40" value="16" style="flex:1;" oninput="syncFont('date','slider')">
                    <input type="number" id="dateFontInput" min="8" max="40" value="16" style="width:54px;text-align:center;padding:4px 6px;font-size:14px;border:1px solid #ccc;border-radius:6px;" oninput="syncFont('date','input')">
                    <span style="color:#888;font-size:13px;">px</span>
                </div>
            </div>
        </div>

        <hr class="divider">

        <div class="control-section">
            <span style="font-weight: bold; color: #333;">選擇列印月份</span>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button id="clearNotesBtn" class="btn-secondary btn-small" style="background-color:#6c757d;">🗑 清除備註</button>
                <button id="selectAllBtn" class="btn-secondary btn-small">全選 / 全不選</button>
            </div>
        </div>
        <div class="month-selectors" id="monthSelectors">
            </div>
    </div>

    <div id="calendarContainer">
        <div style="color:white; font-size: 16px; margin-top: 50px; text-align: center;">載入中...</div>
    </div>

    <script>
        const yearSelect = document.getElementById('yearSelect');
        const monthSelectors = document.getElementById('monthSelectors');
        const calendarContainer = document.getElementById('calendarContainer');
        const selectAllBtn = document.getElementById('selectAllBtn');
        const showHolidaysCheckbox = document.getElementById('showHolidays');
        const sundayFirstCheckbox = document.getElementById('sundayFirst');
        const marginInput = document.getElementById('marginAll');

        const chineseMonths = ["", "一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];
        
        // 假日快取物件，避免重複發送 API 請求
        const holidayCache = {};

        const showLunarCheckbox = document.getElementById('showLunar');
        const ecoCheckbox = document.getElementById('ecoMode');
        const holidayNotice = document.getElementById('holidayNotice');

        // ===== ★ 設定與備註存在這台裝置（localStorage）=====
        const SETTINGS_KEY = 'cal_settings_v1';
        const NOTES_KEY = 'cal_notes_v1';
        function loadJSON(key, fallback) {
            try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; } catch (e) { return fallback; }
        }
        function saveJSON(key, value) {
            try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 無痕模式或空間滿就略過 */ }
        }
        let settingsReady = false;   // 還原設定完成前不存，避免預設值蓋掉上次的設定
        function saveSettings() {
            if (!settingsReady) return;
            saveJSON(SETTINGS_KEY, {
                year: yearSelect.value,
                orientation: currentOrientation,
                titleFont: titleFontSize,
                dateFont: dateFontSize,
                margin: marginInput.value,
                months: [...document.querySelectorAll('.month-checkbox:checked')].map(cb => parseInt(cb.value)),
                showHolidays: showHolidaysCheckbox.checked,
                sundayFirst: sundayFirstCheckbox.checked,
                showLunar: showLunarCheckbox.checked,
                eco: ecoCheckbox.checked,
            });
        }
        // 備註：以實際日期為鍵（YYYY-M-D），換方向／年份／月份重畫、重新整理都還在；同一天出現在兩頁會同步
        let notes = loadJSON(NOTES_KEY, {});
        let notesTimer = null;
        function saveNotesSoon() { clearTimeout(notesTimer); notesTimer = setTimeout(() => saveJSON(NOTES_KEY, notes), 300); }
        window.addEventListener('pagehide', () => saveJSON(NOTES_KEY, notes));
        function clearNotes() {
            if (!Object.keys(notes).length) { alert('目前沒有備註'); return; }
            if (!confirm('確定清除所有日期格子裡的備註？清除後無法復原。')) return;
            notes = {};
            saveJSON(NOTES_KEY, notes);
            document.querySelectorAll('.todo-input').forEach(el => { el.textContent = ''; });
        }

        function applyEco() { calendarContainer.classList.toggle('eco-mode', ecoCheckbox.checked); }

        function setHolidayNotice(text) {
            holidayNotice.textContent = text;
            holidayNotice.classList.toggle('show', !!text);

        function lunarLeapMonth(info) { return info & 0xf; }
        function lunarLeapDays(info) { return lunarLeapMonth(info) ? ((info & 0x10000) ? 30 : 29) : 0; }
        function lunarMonthDays(info, m) { return (info & (0x10000 >> m)) ? 30 : 29; }

            if (offset < 0) return null;
            let i = 0;
            for (; i < LUNAR_INFO.length; i++) {
                const yd = lunarYearDays(LUNAR_INFO[i]);
                if (offset < yd) break;
                offset -= yd;
            }
            if (i >= LUNAR_INFO.length) return null;
            const info = LUNAR_INFO[i], leap = lunarLeapMonth(info);
            for (let month = 1; month <= 12; month++) {

                if (offset < md) return { month, day: offset + 1, isLeap: false };
                offset -= md;
                if (leap === month) {

                if (!response.ok) throw new Error('API fetch error');
                
                const data = await response.json();
                const holidays = {};
                
                data.forEach(item => {
                    if (item.isHoliday && item.description) {
                        const y = item.date.substring(0, 4);
                        const m = parseInt(item.date.substring(4, 6), 10);
                        const d = parseInt(item.date.substring(6, 8), 10);
                        holidays[`${y}-${m}-${d}`] = item.description;
                    }
                });
                
                saveJSON('cal_holidays_' + year, holidays);   // 存一份，下次連不上也能用
                holidayCache[year] = { data: holidays, source: 'net' };
                return holidayCache[year];
            } catch (error) {
                console.warn(`無法取得 ${year} 年假日資料:`, error);
                const cached = loadJSON('cal_holidays_' + year, null);
                if (cached && Object.keys(cached).length) holidayCache[year] = { data: cached, source: 'cache' };
                else if (BUILTIN_HOLIDAYS[year]) holidayCache[year] = { data: BUILTIN_HOLIDAYS[year], source: 'builtin' };
                else holidayCache[year] = { data: {}, source: 'none' };
                return holidayCache[year];
            }
        }

        // 核心功能：生成選中月份的日曆
        let renderSeq = 0;
        async function generateCalendars() {
            const seq = ++renderSeq;
            saveSettings();
            applyEco();
            const year = parseInt(yearSelect.value);
            const checkboxes = document.querySelectorAll('.month-checkbox:checked');
            const isSundayFirst = sundayFirstCheckbox.checked;

            if (checkboxes.length === 0) {
                calendarContainer.innerHTML = '<div style="color:white; font-size: 16px; margin-top: 50px; text-align: center;">請在上方至少勾選一個月份以產生月曆。</div>';
                return;
            }

            // 控制是否加上顯示假日底色的 class
            if (showHolidaysCheckbox.checked) {
                calendarContainer.classList.add('show-holidays-mode');
            } else {
                calendarContainer.classList.remove('show-holidays-mode');
            }

            if (showHolidaysCheckbox.checked && !holidayCache[year]) {
                 calendarContainer.innerHTML = '<div style="color:white; font-size: 16px; margin-top: 50px; text-align: center;">正在載入假日資料...</div>';
            }

            // 準備假日資料
            let holidaysData = {};
            let notice = '';
            if (showHolidaysCheckbox.checked) {
                // 一月頁會出現去年 12 月底、十二月頁會出現明年 1 月初 → 也抓相鄰年份
                const months = [...checkboxes].map(cb => parseInt(cb.value));
                const years = [year];
                if (months.includes(1)) years.push(year - 1);
                if (months.includes(12)) years.push(year + 1);
                const results = await Promise.all(years.map(fetchTaiwanHolidays));
                results.slice().reverse().forEach(r => Object.assign(holidaysData, r.data));
                const main = results[0];
                if (main.source === 'cache') notice = `⚠️ 目前連不上假日資料網站，先用上次存下的 ${year} 年假日。`;
                else if (main.source === 'builtin') notice = `⚠️ 目前連不上假日資料網站，先用內建的 ${year} 年假日。`;
                else if (main.source === 'none') notice = `⚠️ 抓不到 ${year} 年的假日資料，月曆上只標週末。網路恢復後重新整理即可。`;
            }
            if (seq !== renderSeq) return;   // 期間又改了設定，交給較新的那次重畫
            setHolidayNotice(notice);

            calendarContainer.innerHTML = ''; // 清空準備重繪

            checkboxes.forEach(cb => {
                const month = parseInt(cb.value);
                createMonthPage(year, month, holidaysData, isSundayFirst);
            });
        }

        // 負責產生單個月份 DOM 結構
        function createMonthPage(year, month, holidaysData, isSundayFirst) {
            const pageDiv = document.createElement('div');
            pageDiv.className = 'page';

            const headerDiv = document.createElement('div');
            headerDiv.className = 'calendar-header';
            headerDiv.textContent = `${chineseMonths[month]} ${year}`;
            pageDiv.appendChild(headerDiv);

            const gridDiv = document.createElement('div');
            gridDiv.className = 'calendar-grid';

            // 星期表頭 (根據起始日設定)
            const weekdaysDiv = document.createElement('div');
            weekdaysDiv.className = 'weekdays';
            const currentDaysOfWeek = isSundayFirst ? 
                ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"] :
                ["星期一", "星期二", "星期三", "星期四", "星期五", "星期六", "星期日"];

            currentDaysOfWeek.forEach((dayText, index) => {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'weekday';
                
                // 判斷表頭的週末變紅字
                if (isSundayFirst) {
                    if (index === 0 || index === 6) dayDiv.classList.add('weekend');
                } else {
                    if (index === 5 || index === 6) dayDiv.classList.add('weekend');
                }
                
                dayDiv.textContent = dayText;
                weekdaysDiv.appendChild(dayDiv);
            });
            gridDiv.appendChild(weekdaysDiv);

            const daysDiv = document.createElement('div');
            daysDiv.className = 'days';

            const firstDayDate = new Date(year, month - 1, 1);
            let firstDayOfWeek = firstDayDate.getDay(); // 0(Sun) ~ 6(Sat)
            
            // 根據起始日重新計算偏移量
            if (isSundayFirst) {
                // 如果星期日是第一天，第一欄對應 1，剛好 getDay()+1
                firstDayOfWeek = firstDayOfWeek + 1; 
            } else {
                // 如果星期一是第一天，星期日(0)要移到最後一欄(7)
                if (firstDayOfWeek === 0) firstDayOfWeek = 7;
            }

            const daysInMonth = new Date(year, month, 0).getDate();
            const daysInPrevMonth = new Date(year, month - 1, 0).getDate();

            let dateCounter = 1;
            let nextMonthCounter = 1;
            let prevMonthCounter = daysInPrevMonth - firstDayOfWeek + 2;

            for (let row = 0; row < 6; row++) {
                const weekRow = document.createElement('div');
                weekRow.className = 'week-row';

                for (let col = 1; col <= 7; col++) {
                    const dayCell = document.createElement('div');
                    dayCell.className = 'day-cell';

                    const dayHeader = document.createElement('div');
                    dayHeader.className = 'day-header';
                    
                    const daySpan = document.createElement('span');
                    daySpan.className = 'day-number';

                    const holidaySpan = document.createElement('span');
                    holidaySpan.className = 'holiday-text';

                    let currentCellDate = "";
                    let isCurrentMonth = false;

                    if (row === 0 && col < firstDayOfWeek) {
                        dayCell.classList.add('other-month');
                        daySpan.textContent = prevMonthCounter;
                        currentCellDate = `${month === 1 ? year - 1 : year}-${month === 1 ? 12 : month - 1}-${prevMonthCounter}`;
                        prevMonthCounter++;
                    } else if (dateCounter <= daysInMonth) {
                        daySpan.textContent = dateCounter;
                        currentCellDate = `${year}-${month}-${dateCounter}`;
                        isCurrentMonth = true;
                        
                        // 判斷實體日期的週末並加上 is-holiday class
                        if (isSundayFirst) {
                            if (col === 1 || col === 7) dayCell.classList.add('is-holiday');
                        } else {
                            if (col === 6 || col === 7) dayCell.classList.add('is-holiday');
                        }
                        
                        dateCounter++;
                    } else {
                        dayCell.classList.add('other-month');
                        daySpan.textContent = nextMonthCounter;
                        currentCellDate = `${month === 12 ? year + 1 : year}-${month === 12 ? 1 : month + 1}-${nextMonthCounter}`;
                        nextMonthCounter++;
                    }

                    if (holidaysData[currentCellDate]) {
                        holidaySpan.textContent = holidaysData[currentCellDate];
                        if (isCurrentMonth) dayCell.classList.add('is-holiday');
                    }

                    const dayLeft = document.createElement('div');
                    dayLeft.className = 'day-left';
                    dayLeft.appendChild(daySpan);
                    if (showLunarCheckbox.checked && currentCellDate) {
                        const [cy, cm, cd] = currentCellDate.split('-').map(Number);
                        const lt = lunarCellText(cy, cm, cd);
                        if (lt) {
                            const lunarSpan = document.createElement('span');
                            lunarSpan.className = 'lunar-text ' + lt.kind;
                            lunarSpan.textContent = lt.text;
                            dayLeft.appendChild(lunarSpan);
                        }
                    }
                    dayHeader.appendChild(dayLeft);
                    dayHeader.appendChild(holidaySpan);
                    dayCell.appendChild(dayHeader);

                    const todoInput = document.createElement('div');
                    todoInput.className = 'todo-input';
                    todoInput.contentEditable = 'true';
                    // ★ 備註：還原＋輸入時保存（同一天在別頁的格子同步）
                    todoInput.dataset.date = currentCellDate;
                    if (notes[currentCellDate]) todoInput.innerText = notes[currentCellDate];
                    todoInput.addEventListener('input', () => {
                        const text = todoInput.innerText.replace(/\n+$/, '');
                        if (text.trim()) notes[currentCellDate] = text; else delete notes[currentCellDate];
                        document.querySelectorAll(`.todo-input[data-date="${currentCellDate}"]`).forEach(el => {
                            if (el !== todoInput && el.innerText.replace(/\n+$/, '') !== text) el.innerText = text;
                        });
                        saveNotesSoon();
                    });
                    todoInput.addEventListener('paste', function(e) {
                        e.preventDefault();
                        const text = (e.originalEvent || e).clipboardData.getData('text/plain');
                        document.execCommand('insertText', false, text);
                    });

                    dayCell.appendChild(todoInput);
                    weekRow.appendChild(dayCell);
                }
                daysDiv.appendChild(weekRow);
            }

            gridDiv.appendChild(daysDiv);
            pageDiv.appendChild(gridDiv);
            calendarContainer.appendChild(pageDiv);
        }

        // ===== ★ 下載 PDF：每頁用 html2canvas 截成圖，jsPDF 組成 A4 PDF（手機不用經過列印選單）=====
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                if ([...document.scripts].some(sc => sc.src === src)) return resolve();
                const sc = document.createElement('script');
                sc.src = src;
                sc.onload = () => resolve();
                sc.onerror = () => reject(new Error('無法載入 PDF 元件，請確認網路連線'));
                document.head.appendChild(sc);
            });
        }
        let pdfBusy = false;
        async function downloadPDF() {
            if (pdfBusy) return;
            const pages = [...calendarContainer.querySelectorAll('.page')];
            if (!pages.length) { alert('請先勾選至少一個月份'); return; }
            pdfBusy = true;
            const overlay = document.getElementById('pdfOverlay');
            const progress = document.getElementById('pdfProgress');
            const root = document.documentElement;
            const prevZoom = root.style.getPropertyValue('--preview-zoom');
            overlay.classList.add('show');
            progress.textContent = '載入元件中…';
            try {
                await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
                await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
                if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
                root.style.setProperty('--preview-zoom', '1');   // 用實際 A4 尺寸截圖
                await new Promise(r => setTimeout(r, 50));
                const landscape = currentOrientation === 'landscape';
                const W = landscape ? 297 : 210, H = landscape ? 209 : 296;   // 跟列印同一組尺寸（mm）
                const pdf = new window.jspdf.jsPDF({ orientation: landscape ? 'landscape' : 'portrait', unit: 'mm', format: 'a4' });
                for (let i = 0; i < pages.length; i++) {
                    progress.textContent = `第 ${i + 1} / ${pages.length} 頁`;
                    const canvas = await window.html2canvas(pages[i], { scale: 2, backgroundColor: '#ffffff', logging: false });
                    if (i > 0) pdf.addPage('a4', landscape ? 'landscape' : 'portrait');
                    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, W, H);
                    canvas.width = canvas.height = 0;   // 釋放記憶體
                }
                const months = [...document.querySelectorAll('.month-checkbox:checked')].map(cb => cb.value);
                pdf.save(`月曆-${yearSelect.value}${months.length === 12 ? '' : '-' + months.join('_') + '月'}.pdf`);
            } catch (err) {
                alert('PDF 產生失敗：' + err.message + '\n\n可以改用「列印」，在列印畫面選「儲存為 PDF」。');
            } finally {
                if (prevZoom) root.style.setProperty('--preview-zoom', prevZoom); else updatePreviewZoom();
                overlay.classList.remove('show');
                pdfBusy = false;
            }
        }

        // 啟動程式
        init();
    </script>
</body>
